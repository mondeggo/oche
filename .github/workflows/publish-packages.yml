name: Publish application updates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-application-updates-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare project versions across the push
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/release_version.py

  checks:
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/checks.yml

  autodarts:
    needs: [version, checks]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.autodarts.outputs.version }}
    steps:
      - name: Pin one Autodarts release for both architectures
        id: autodarts
        run: |
          set -euo pipefail
          releases=$(curl -fsSL --retry 3 https://releases.autodarts.com/headless/downloads/latest.stable.json)
          version=$(jq -er '.platforms["linux-amd64"].version' <<< "$releases")
          test "$version" = "$(jq -er '.platforms["linux-arm64"].version' <<< "$releases")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  packages:
    needs: [version, autodarts]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - name: Build prepared runtime and export application bundles
        env:
          TAG: ${{ needs.version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          AUTODARTS_VERSION: ${{ needs.autodarts.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]
          docker build --platform "linux/$ARCH" --build-arg "OCHE_VERSION=${TAG#v}" --build-arg AUTODARTS_VERSION -t oche-packages .
          mkdir -p output
          docker run --rm --platform "linux/$ARCH" --user root -v "$PWD/output:/output" --entrypoint python oche-packages \
            /opt/oche-tools/package_updates.py --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: output/*

  release:
    needs: [version, packages]
    runs-on: ubuntu-latest
    concurrency:
      group: oche-application-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: output
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and combined manifest
        run: |
          python -m pip install build
          python - <<'PY'
          import json, pathlib
          platforms = {}
          for path in pathlib.Path('output').glob('updates-*.json'):
              platforms.update(json.loads(path.read_text())['platforms'])
          pathlib.Path('output/updates.json').write_text(json.dumps({'schema': 1, 'platforms': platforms}, indent=2))
          PY
          python -m build --wheel --outdir output
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release view "$TAG" || gh release create "$TAG" --target "$RELEASE_SHA" --generate-notes
          gh release upload "$TAG" output/* --clobber
