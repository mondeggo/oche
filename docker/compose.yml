services:
  oche:
    image: "${OCHE_IMAGE:-mondeggo/oche:latest}"
    container_name: oche
    # Autodarts and the board manager need the host network directly.
    network_mode: host
    init: true
    restart: "${OCHE_RESTART_POLICY:-unless-stopped}"
    environment:
      OCHE_PORT: "${OCHE_PORT:-80}"
      OCHE_HTTPS_PORT: "${OCHE_HTTPS_PORT:-443}"
      OCHE_UPDATE_FEED: "${OCHE_UPDATE_FEED-https://github.com/mondeggo/oche/releases/latest/download/updates.json}"
      OCHE_ACME_DNS_URL: "${OCHE_ACME_DNS_URL:-https://auth.acme-dns.io}"
      OCHE_CORE_CLIENT_ID: "${OCHE_CORE_CLIENT_ID:-}"
      OCHE_CORE_BOARD_ID: "${OCHE_CORE_BOARD_ID:-}"
      OCHE_CORE_LOCAL_AUTODARTS_URL: "${OCHE_CORE_LOCAL_AUTODARTS_URL:-http://127.0.0.1:3180}"
    volumes:
      - ./data:/app/data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    # Camera and USB access lives in docker-compose.override.yml (./oche.sh cameras).
