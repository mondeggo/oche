# Local development with live reload and separate persistent data.
services:
  oche:
    build:
      context: .
      args:
        AUTOGLOW_VERSION: ${AUTOGLOW_VERSION:-}
      secrets:
        - autoglow_token
    image: oche:dev
    container_name: oche-dev
    restart: "no"
    environment:
      OCHE_PORT: "8180"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8180 --reload --reload-dir /app/app
    volumes:
      - ./app:/app/app
      - dev-data:/app/data
      - dev-autodarts:/app/data/autodarts

secrets:
  autoglow_token:
    environment: AUTOGLOW_TOKEN

volumes:
  dev-data:
  dev-autodarts:
