# Local development with live reload and persistent data in ./data.
services:
  oche:
    build:
      context: .
      args:
        AUTOGLOW_VERSION: ${AUTOGLOW_VERSION:-}
        OCHECORE_VERSION: ${OCHECORE_VERSION:-6cb3622917cb2cdbda813984268b3cf6e2e8f0e8}
      secrets:
        - autoglow_token
    image: oche:dev
    container_name: oche-dev
    restart: "no"
    environment:
      OCHE_PORT: "8180"
      # Leave 9180 available for standalone OcheCore development.
      OCHE_OCHECORE_PORT: "${OCHE_DEV_OCHECORE_PORT:-9280}"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8180 --reload --reload-dir /app/app
    volumes:
      - ./app:/app/app
      - ./data:/app/data

secrets:
  autoglow_token:
    environment: AUTOGLOW_TOKEN
