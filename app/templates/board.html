{% extends "base.html" %}
{% block title %}Oche - Autodarts{% endblock %}
{% block content %}
<div id="board-disconnected" class="board-placeholder" hidden>
  <div class="board-placeholder-inner">
    <img src="/static/img/autodarts_logo.svg" alt="" class="board-placeholder-icon">
    <h1 id="board-placeholder-title" class="board-placeholder-title">Autodarts is offline</h1>
    <p id="board-placeholder-text" class="board-placeholder-text">Start the board manager to bring your board online.</p>
    <button id="board-start-btn" onclick="startAutodarts()">Start Autodarts</button>
  </div>
</div>

<div id="board-frame" class="board-frame shared-board-slot" hidden></div>

<script>
const boardUrl = `${location.protocol}//${location.hostname}:3180/`;
const boardFrame = document.getElementById('board-frame');
const boardDisconnected = document.getElementById('board-disconnected');
const boardTitle = document.getElementById('board-placeholder-title');
const boardText = document.getElementById('board-placeholder-text');
const boardStartBtn = document.getElementById('board-start-btn');
let boardPid = null;
let starting = false;

function sharedBoard() {
  try {
    if (window.ocheBoard) return window.ocheBoard;
    if (parent !== window && parent.ocheBoard) return parent.ocheBoard;
  } catch (_) { /* Oche may itself be embedded by another origin. */ }
  return null;
}

function showOffline() {
  sharedBoard()?.hide(boardFrame);
  boardFrame.hidden = true;
  boardDisconnected.hidden = false;
  boardTitle.textContent = 'Autodarts is offline';
  boardText.textContent = 'Start the board manager to bring your board online.';
  boardStartBtn.hidden = false;
  boardStartBtn.disabled = false;
  boardStartBtn.textContent = 'Start Autodarts';
}

function showStarting() {
  sharedBoard()?.hide(boardFrame);
  boardDisconnected.hidden = false;
  boardFrame.hidden = true;
  boardTitle.textContent = 'Starting Autodarts…';
  boardText.textContent = 'Waiting for the board manager to come online. This can take a few seconds.';
  boardStartBtn.hidden = true;
}

function showOnline() {
  boardFrame.hidden = false;
  boardDisconnected.hidden = true;
  sharedBoard()?.show(boardFrame, boardPid);
}

// Only 3180 actually responding proves Autodarts is ready to be embedded -
// our own /autodarts/status only reflects whether the subprocess exists,
// which can be "running" while its HTTP server is still booting.
async function isBoardReachable() {
  try {
    await fetch(boardUrl, { mode: 'no-cors', cache: 'no-store' });
    return true;
  } catch (e) {
    return false;
  }
}

async function pollBoardStatus() {
  if (starting) return; // startAutodarts() owns its own polling loop
  const res = await fetch('/autodarts/status').catch(() => null);
  const data = res ? await res.json().catch(() => null) : null;
  if (!data || data.status !== 'running') {
    showOffline();
    return;
  }
  if (await isBoardReachable()) {
    boardPid = data.pid;
    showOnline();
  } else {
    showOffline();
  }
}

async function startAutodarts() {
  starting = true;
  showStarting();
  try {
    const res = await fetch('/autodarts/start', { method: 'POST' });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.detail || 'Failed to start Autodarts');
      starting = false;
      showOffline();
      return;
    }
  } catch (e) {
    starting = false;
    showOffline();
    return;
  }

  const deadline = Date.now() + 60000;
  while (Date.now() < deadline) {
    if (await isBoardReachable()) {
      starting = false;
      await pollBoardStatus();
      return;
    }
    await new Promise(r => setTimeout(r, 1500));
  }
  starting = false;
  boardText.textContent = 'Autodarts is taking longer than expected to start. Check the logs on the Autodarts tab.';
  boardStartBtn.hidden = false;
  boardStartBtn.disabled = false;
  boardStartBtn.textContent = 'Retry';
}

// Paint something intentional immediately (dark placeholder), then check
// real status after a short delay rather than racing the iframe navigation
// against the page's own first paint.
showOffline();
setTimeout(pollBoardStatus, 800);
setInterval(pollBoardStatus, 5000);
</script>
{% endblock %}
