<!doctype html>
<html lang="{{ ui_language }}" data-theme="{{ ui_theme }}" data-profile-id="{{ nav_profiles.active_profile or '' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ _("Autodarts setup") }}</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <script id="oche-translations" type="application/json">{{ translations | tojson }}</script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/static/css/terminal.css">
</head>
<body>
  <div class="terminal-toolbar">
    <span id="terminal-status" role="status">{{ _("Connecting…") }}</span>
    <span id="terminal-copy-status" role="status"></span>
    <button id="terminal-keys-toggle" type="button" aria-controls="terminal-touch-keys" aria-expanded="false">{{ _("Keys") }}</button>
    <button type="button" id="terminal-keyboard" aria-label="{{ _('Keyboard') }}" title="{{ _('Open keyboard') }}">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M5 9h2m2 0h2m2 0h2m2 0h2M5 12h2m2 0h2m2 0h2m2 0h2M7 16h10"/></svg>
    </button>
    <button id="terminal-reconnect" type="button">{{ _("Reconnect") }}</button>
  </div>
  <div id="terminal" aria-label="{{ _('Autodarts interactive setup terminal') }}"></div>
  <div id="terminal-touch-keys" class="terminal-touch-keys" role="group" aria-label="{{ _('Terminal keys') }}" hidden>
    <button type="button" data-key="Escape">{{ _("Esc") }}</button>
    <button type="button" data-key="Tab">Tab</button>
    <button type="button" data-key="ArrowLeft" aria-label="{{ _('Left arrow') }}">&#8592;</button>
    <button type="button" data-key="ArrowUp" aria-label="{{ _('Up arrow') }}">&#8593;</button>
    <button type="button" data-key="ArrowDown" aria-label="{{ _('Down arrow') }}">&#8595;</button>
    <button type="button" data-key="ArrowRight" aria-label="{{ _('Right arrow') }}">&#8594;</button>
    <button type="button" data-key="Enter">Enter</button>
  </div>
  <div id="terminal-context-menu" role="menu" aria-label="{{ _('Terminal') }}" hidden>
    <button id="terminal-copy" type="button" role="menuitem">{{ _("Copy") }}</button>
  </div>
  <script src="/static/vendor/xterm/xterm.js"></script>
  <script src="/static/vendor/xterm/addon-fit.js"></script>
  <script src="/static/vendor/xterm/addon-web-links.js"></script>
  <script src="/static/js/autodarts-terminal.js?v=9"></script>
</body>
</html>
