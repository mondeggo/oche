<!doctype html>
<html lang="{{ ui_language }}" data-theme="{{ ui_theme }}" data-profile-id="{{ nav_profiles.active_profile or '' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>{% block title %}Oche{% endblock %}</title>
    <script id="oche-translations" type="application/json">{{ translations | tojson }}</script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/theme.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    {% if core_page %}<link rel="stylesheet" href="/static/core/style.css"><link rel="stylesheet" href="/static/core/wled2.css">{% endif %}
    <link rel="stylesheet" href="/static/css/integrated.css">
  </head>
  <body>
    <div id="oche-page" class="app-shell" data-sidebar-page="{{ sidebar_page }}" data-sidebar-default="{{ '1' if sidebar_collapsed else '0' }}">
    <script>
      // Restore the sidebar width before the first paint so the page does not jump.
      (() => {
        const shell = document.getElementById('oche-page');
        let collapsed = shell.dataset.sidebarDefault === '1';
        try {
          const saved = sessionStorage.getItem('oche.sidebar.' + shell.dataset.sidebarPage);
          if (saved !== null) collapsed = saved === '1';
        } catch (_) { /* Use the configured default. */ }
        shell.classList.toggle('sidebar-collapsed', collapsed);
      })();
    </script>
    <header class="mobile-bar">
      <a class="brand" href="/" aria-label="{{ _('Oche Home') }}"><span class="brand-mark" aria-hidden="true"></span>Oche</a>
      <button id="nav-toggle" class="icon-button" type="button" aria-label="{{ _('Open menu') }}" aria-controls="app-sidebar" aria-expanded="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </header>
    {% include "sidebar.html" %}
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    <main id="main" tabindex="-1" class="{{ 'container-full' if full_width else 'container' }} {{ 'home-viewport' if core_page }} {{ 'container-wide' if active_nav in ['autodarts', 'cameras', 'system', 'updates'] }}">
      {% block content %}{% endblock %}
    </main>
    </div>
    <script type="module" src="/static/js/navigation.js"></script>
    <script type="module" src="/static/js/app.js"></script>
    <script src="/static/js/update-wait.js" defer></script>
    <script src="/static/js/application.js" defer></script>
    <script src="/static/js/service-updates.js" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
