<section id="local-football" class="football" aria-label="{{ _('Football pitch') }}" hidden>
  <div class="football-scoreboard">
    {% for side in [0, 1] %}
    <div id="football-team-{{ side }}" class="football-team" data-team="{{ side }}">
      <div><p id="football-name-{{ side }}" class="football-name"></p><p class="football-direction">{{ _('Attacks D6 →') if side == 0 else _('← Attacks D11') }}</p></div>
      <strong id="football-score-{{ side }}" class="football-score">0</strong>
    </div>
    {% endfor %}
  </div>
  <div class="football-field">
    <svg viewBox="0 0 1000 640" role="img" aria-labelledby="football-pitch-title football-pitch-description">
      <title id="football-pitch-title">{{ _("Football pitch") }}</title>
      <desc id="football-pitch-description">{{ _("D11 is the left goal. D6 is the right goal.") }}</desc>
      <defs><pattern id="football-grass" width="180" height="640" patternUnits="userSpaceOnUse"><rect width="90" height="640" fill="#ffffff" opacity=".035"/></pattern></defs>
      <rect width="1000" height="640" rx="24" fill="#126d49"/>
      <rect width="1000" height="640" rx="24" fill="url(#football-grass)"/>
      <g class="football-lines" fill="none" stroke="#d6f1dc" stroke-width="3">
        <rect x="50" y="50" width="900" height="540"/>
        <path d="M500 50V590"/><circle cx="500" cy="320" r="80"/>
        <path d="M50 170H190V470H50 M950 170H810V470H950 M50 245H105V395H50 M950 245H895V395H950"/>
        <path d="M190 255Q250 320 190 385 M810 255Q750 320 810 385"/>
        <rect id="football-goal-left" x="20" y="270" width="30" height="100"/>
        <rect id="football-goal-right" x="950" y="270" width="30" height="100"/>
      </g>
      <g fill="#d6f1dc"><circle cx="500" cy="320" r="4"/><circle cx="150" cy="320" r="4"/><circle cx="850" cy="320" r="4"/></g>
      <g class="football-goal-labels" fill="#effff4" text-anchor="middle"><text x="85" y="230">D11</text><text x="915" y="230">D6</text></g>
      <polygon id="football-attack" class="football-attack" points="500,320 950,270 950,370" visibility="hidden"/>
      <g id="football-ball" class="football-ball" transform="translate(500 320)">
        <circle r="18" fill="#f7f9f6" stroke="#102b21" stroke-width="2"/>
        <path d="M0 -8 8 -2 5 8 -5 8 -8 -2Z M0 -18V-8 M17 -5 8 -2 M10 15 5 8 M-10 15 -5 8 M-17 -5 -8 -2" fill="#102b21" stroke="#102b21" stroke-width="2"/>
      </g>
    </svg>
  </div>
  <div class="football-guidance" aria-live="polite">
    <p id="football-message" class="football-message"></p>
    <p id="football-target" class="football-target"></p>
  </div>
</section>
