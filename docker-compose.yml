services:
  oche:
    image: "${OCHE_IMAGE:-oche:latest}"
    container_name: oche

    # Autodarts needs host network directly.
    network_mode: host

    environment:
      OCHE_PORT: "${OCHE_PORT:-80}"

    volumes:
      # Persistent application data
      - ./data:/app/data

      # Host timezone
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false

      # Expose the host device tree so newly connected
      # /dev/video* devices are visible inside the container.
      - /dev:/dev

    init: true
    restart: "${OCHE_RESTART_POLICY:-unless-stopped}"