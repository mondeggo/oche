services:
  oche:
    build: .
    image: oche:dev
    restart: "no"
    environment:
      OCHE_PORT: "8180"
      OCHE_HTTPS_PORT: "8443"
      OCHE_UPDATE_FEED: ""
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8180", "--reload"]
    volumes:
      - ./app:/app/app
    # Development reload bypasses the launcher; updates/restart use the normal service.
